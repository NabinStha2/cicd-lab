name: Security Scan

# CodeQL analyzes the code for security vulnerabilities
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # needed to upload results
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Initialize CodeQL with the Java query suite
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      # CodeQL needs to observe a real build to understand the code
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress compile -DskipTests

      # Analyze and upload findings to the Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3