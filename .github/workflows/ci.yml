name: CI Pipeline

# Controls when the workflow runs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

# Environment variables available to all jobs
env:
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

jobs:
  # Job: compile, test, package
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up JDK 21 (Temurin) with caching
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify the environment
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Compile source code
      - name: Compile
        run: ./mvnw --batch-mode --no-transfer-progress compile

      # 5. Run all tests (unit + integration)
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      # 6. Package the JAR (includes tests compile)
      - name: Package JAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      # 7. Upload the built JAR as an artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: cicd-lab-jar
          path: target/*.jar
          retention-days: 7

  # Job: verify the artifact works (smoke test)
  smoke-test:
    name: Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: cicd-lab-jar
          path: target

      - name: List downloaded files
        run: ls -la target/

      - name: Smoke test - start app and check health endpoint
        run: |
          # Start the app in the background, capture its PID
          java -jar target/cicd-lab-*.jar &
          APP_PID=$!

          # Poll the actuator health endpoint until it responds (max ~60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ App is UP (attempt $i)"
              curl -s http://localhost:8080/api/hello
              echo ""
              # Shut the app down cleanly
              kill $APP_PID
              exit 0
            fi
            echo "Waiting for app... (attempt $i)"
            sleep 2
          done

          # If we get here, the app never became healthy
          echo "❌ App failed to become healthy in 60s"
          kill $APP_PID
          exit 1